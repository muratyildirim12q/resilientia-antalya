<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Arka Plan Hologram Izgarası -->
  <circle cx="100" cy="110" r="85" fill="none" stroke="rgba(14, 165, 233, 0.2)" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="100" cy="110" r="68" fill="none" stroke="rgba(16, 185, 129, 0.15)" stroke-width="1" />

  <!-- Boyun ve Omuzlar -->
  <path d="M50 230 C50 190, 75 175, 88 165 L112 165 C125 175, 150 190, 150 230 Z" fill="url(#faceGrad)" stroke="#0ea5e9" stroke-width="1.5"/>

  <!-- Yaka Siber Detay -->
  <path d="M85 180 L100 195 L115 180" fill="none" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>

  <!-- Yüz Ovali -->
  <path d="M72 90 C72 55, 128 55, 128 90 C128 135, 115 155, 100 155 C85 155, 72 135, 72 90 Z" fill="url(#faceGrad)" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Modern Saç Kesimi (Sleek Bob) -->
  <path d="M68 85 C68 45, 132 45, 132 85 C134 110, 130 130, 126 138 C122 100, 115 70, 100 70 C85 70, 78 100, 74 138 C70 130, 66 110, 68 85 Z" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>

  <!-- Kulaklık / Veri Arayüzü (Headset & HUD Visor) -->
  <rect x="66" y="92" width="6" height="18" rx="3" fill="#0ea5e9" filter="url(#glow)"/>
  <path d="M69 105 L85 118 L95 118" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>
  <circle cx="95" cy="118" r="2" fill="#10b981" filter="url(#glow)"/>

  <!-- Siber Gözlük / AR Vizör -->
  <path d="M76 92 L124 92 L121 104 L79 104 Z" fill="rgba(14, 165, 233, 0.35)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"/>
  <line x1="82" y1="98" x2="118" y2="98" stroke="#10b981" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Minimal Burun ve Dudak Hattı -->
  <path d="M100 115 L99 126 L103 127" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1"/>
  <line x1="96" y1="138" x2="104" y2="138" stroke="rgba(255, 255, 255, 0.5)" stroke-width="1.5"/>

  <!-- Durum Sinyali -->
  <circle cx="160" cy="40" r="4" fill="#10b981" filter="url(#glow)"/>
  <text x="150" y="55" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10b981" text-anchor="middle">ONLINE</text>
</svg>
